services:
  clickhouse:
    image: clickhouse:26.8
    container_name: clickhouse-gemini
    restart: unless-stopped
    ports:
      - "8123:8123"   # HTTP Interface
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    environment:
      - CLICKHOUSE_DB=default
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_log:/var/log/clickhouse-server

  rustfs:
    image: rustfs/rustfs:1.0.0-rc.6-glibc
    container_name: rustfs-gemini
    restart: unless-stopped
    ports:
      - "9000:9000"   # S3 API (แมปพอร์ต Host เป็น 9001 เพื่อไม่ให้ชนกับ ClickHouse Native Port 9000)
      - "9001:9001"   # Web Console / UI
    environment:
      - RUSTFS_ROOT_USER=admin
      - RUSTFS_ROOT_PASSWORD=123
    volumes:
      - rustfs_data:/data

volumes:
  clickhouse_data:
  clickhouse_log:
  rustfs_data: